name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  ci:
    uses: RoastedHawk/.github/.github/workflows/python-ci-readonly.yml@main
    with:
      run-matrix: "['3.11','3.12']"
      cov-threshold: '90'
  results-chart:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate results chart
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python scripts/generate_results_chart.py --input results/evals.jsonl --output docs/results.svg || true
      - name: Upload results chart
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-svg
          path: docs/results.svg
  gitleaks:
    needs: ci
    uses: RoastedHawk/.github/.github/workflows/gitleaks.yaml@main
  sbom:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate dependency snapshot
        run: |
          python -m pip list --format=json > docs/sbom_pip.json
      - name: Upload SBOM (pip list)
        uses: actions/upload-artifact@v4
        with:
          name: sbom-pip
          path: docs/sbom_pip.json
