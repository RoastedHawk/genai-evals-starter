[project]
name = "genai-evals-starter"
version = "0.1.0"
description = "Starter kit for GenAI evaluation workflows in Python"
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E","F","I","B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
