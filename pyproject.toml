[project]
name = "genai-evals-starter"
version = "0.1.0"
description = "Starter kit for GenAI evaluation workflows in Python"
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
selabs = "selabs.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E","F","I","B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
